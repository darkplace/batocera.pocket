{
  "screenshot":       "batocera-screenshot",
  "volumeup":         "batocera-audio setSystemVolume +5",
  "volumedown":       "batocera-audio setSystemVolume -5",
  "volumemute":       "batocera-audio setSystemVolume mute-toggle",
  "brightness-cycle": "batocera-brightness cycle",
  "bezels":           [ "KEY_RIGHTSHIFT", "KEY_UNDO" ],
  "controlcenter":    "batocera-controlcenter",
  "forcekill":        "batocera-mouse-mode disable; batocera-es-swissknife --emukill 5",
  "forceclose":       [ "KEY_LEFTALT", "KEY_F4" ],
  "osk_toggle":       "/usr/bin/onscreen-keyboard toggle",
  "ally_hotkey":      "KEY_LEFTSHIFT",
  "steam_chord":      [ "KEY_LEFTCTRL", "KEY_1" ],
  "steam_overlay":    [ "KEY_LEFTSHIFT", "KEY_TAB" ],
  "steam_qam":        "/usr/bin/batocera-steam-qam",
  "steam_screenshot": "KEY_F12",
  "mousemode":        "/usr/bin/batocera-mouse-mode toggle"
}
