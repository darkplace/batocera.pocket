<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" href="backglass-game-controls.css"/>
    <script src="backglass-game-controls.js" type="text/javascript"></script>
</head>
<body>
    <main id="controls">
        <section id="state-panel">
            <div class="panel-title">Save State</div>
            <div class="button-grid state-grid">
                <button data-hotkey="save-state">Save</button>
                <button data-hotkey="load-state">Load</button>
                <button data-hotkey="slot-previous">Slot -</button>
                <button data-hotkey="slot-next">Slot +</button>
            </div>
        </section>
        <section id="quick-panel">
            <div class="panel-title">Runtime</div>
            <div class="button-grid quick-grid">
                <button data-hotkey="menu">Menu</button>
                <button data-hotkey="screenshot">Shot</button>
                <button id="top-shot">Top Shot</button>
                <button id="record-start">Start Rec</button>
                <button id="record-stop">Stop Rec</button>
                <button id="force-kill" class="danger">Kill Game</button>
            </div>
        </section>
        <section id="motion-panel">
            <div class="panel-title">Playback</div>
            <div class="button-grid motion-grid">
                <button data-hotkey="rewind">Rewind</button>
                <button data-hotkey="fast-forward">Fast Fwd</button>
            </div>
        </section>
        <div id="status"></div>
    </main>
</body>
</html>
